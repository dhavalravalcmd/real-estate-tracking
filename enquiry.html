<!doctype html><html lang="en"><head><title>Enquiry | Surat Homes</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/styles.css">
<!-- ===== GTM + TRACKING INSTALLATION POINT =====
     1) Put your GTM container ID in js/config.js (only place needed).
     2) These two scripts load GTM and push dataLayer events. Keep them in <head>, in this order. -->
<script src="js/config.js"></script>
<script src="js/tracking.js"></script></head><body data-page="enquiry"><header id="site-header"></header><main><section><div class="wrap">
<h1>Property enquiry</h1><p class="muted">Demo form: nothing is sent or stored. Use fake details.</p>
<form id="enq" class="form" novalidate>
<div class="field"><label for="name">Full name *</label><input id="name" name="name" autocomplete="name" aria-describedby="err-name"><p class="err" id="err-name"></p></div>
<div class="field"><label for="phone">Phone number *</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="9876543210" aria-describedby="err-phone"><p class="err" id="err-phone"></p></div>
<div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="err-email"><p class="err" id="err-email"></p></div>
<div class="field"><label for="property">Property of interest *</label><select id="property" name="property" aria-describedby="err-property"></select><p class="err" id="err-property"></p></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="4"></textarea></div>
<button id="submit" class="btn" type="submit">Submit Enquiry</button></form>
<div id="success" tabindex="-1" role="status" hidden><h2>Thank you!</h2><p>Your demo enquiry about <strong id="success-prop"></strong> was received. Nothing was sent to a server.</p><a class="btn" href="properties.html">Browse more properties</a></div>
</div></section></main><div id="site-footer"></div><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
